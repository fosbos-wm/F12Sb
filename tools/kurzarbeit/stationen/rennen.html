<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wichtel-Schubkarrenrennen</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--soft:#e3eef3;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;
 --ra:#c62f2f;--rb:#1f6fb8;--sky1:#9fd3f2;--sky2:#e8f5fb;--dim:1}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--soft:#1d3039;--ok:#6fd49b;--ok-soft:#163626;--bad:#f2928b;--bad-soft:#3a1b19;--ra:#ff7b72;--rb:#6db6ff;--sky1:#1b3550;--sky2:#35506a;--dim:.72}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px max(10px,env(safe-area-inset-left,0))}
main{max-width:980px;margin:0 auto}
h1{font-size:1.2rem;margin:0 0 2px}.sub{color:var(--muted);margin:0 0 10px;font-size:.92rem}
button{font:inherit;color:inherit;cursor:pointer}
.b{font-weight:700;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:11px 22px}
.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#scene{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line);background:var(--sky2)}
.sky1{stop-color:var(--sky1)}.sky2{stop-color:var(--sky2)}
.dim{filter:brightness(var(--dim))}
.wich{transition:transform 1.25s cubic-bezier(.45,.05,.3,1)}
.wheel{transform-box:fill-box;transform-origin:center}
.moving .wheel{animation:spin .45s linear infinite}
.moving .bodybob{animation:bob .3s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{to{transform:translateY(-3px)}}
.barrow{transition:transform .35s;transform-origin:-14px -26px}
.oops .barrow{transform:rotate(-14deg)}
.stars,.bubble{opacity:0;transition:opacity .2s}
.oops .stars,.show .bubble{opacity:1}
.ex{display:none}.ex-n{display:inline}.happy .ex-n,.oops .ex-n{display:none}.happy .ex-h{display:inline}.oops .ex-s{display:inline}
.win .rig{animation:jump .5s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-14px)}}
.cloud{animation:drift 60s linear infinite}.cloud.c2{animation-duration:90s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1020px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
.board{display:flex;gap:10px;margin:10px 0}
.chip{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.chip .dot{width:18px;height:18px;border-radius:50%;flex:none}
.chip b{font-size:1.05rem}.chip .st{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem}
.chip.turn{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px}
.turnbar{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;margin-bottom:8px}
.turnbar .dot{width:16px;height:16px;border-radius:50%}
.ctx{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.qt{font-size:1.2rem;font-weight:700;line-height:1.35;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.35;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--soft);font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;color:var(--fg);margin-top:2px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.names label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.names input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
.end{font-size:1.5rem;font-weight:800;margin:0 0 6px}
.err{color:var(--bad);font-weight:700}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.simcol{display:grid;gap:8px;align-content:start}
.simh{display:flex;align-items:center;gap:8px;border-bottom:4px solid;padding-bottom:6px}.simh .dot{width:14px;height:14px;border-radius:50%}.simst{margin-left:auto;font-size:.82rem;color:var(--muted);font-weight:700}
.opt.pick{border-color:var(--pri);background:var(--soft)}
@media (max-width:640px){.simgrid{grid-template-columns:1fr}}
@media (max-width:560px){.names{grid-template-columns:1fr}.board{flex-direction:column}}
</style></head><body><main>
<h1 id="t">Wichtel-Schubkarrenrennen</h1><p class="sub" id="a"></p>
<svg id="scene" viewBox="0 0 900 340" role="img" aria-label="Zwei Wichtel mit Schubkarren auf einer Rennbahn vor dem Hohenpeißenberg und den Alpen bei Weilheim"></svg>
<div class="board" id="board" hidden></div>
<div id="stage">
 <div class="card" id="start">
  <b>Zwei Teams, ein Rennen.</b>
  <p style="margin:6px 0 0">Die Teams sind abwechselnd dran. Wer richtig antwortet, schiebt die Schubkarre ein Stück weiter. Wer zuerst im Ziel ist, gewinnt.</p>
  <div class="names"><label>Team links (rot)<input id="n0" maxlength="14" value="Team Rot" autocomplete="off"></label><label>Team rechts (blau)<input id="n1" maxlength="14" value="Team Blau" autocomplete="off"></label></div>
  <fieldset style="border:2px solid var(--line);border-radius:12px;margin:0 0 12px;padding:8px 12px"><legend style="font-weight:700;font-size:.9rem;padding:0 6px">Spielweise</legend>
   <label style="display:block;margin:4px 0"><input type="radio" name="mode" value="sim" checked> <b>Gleichzeitig:</b> Beide Teams bekommen dieselbe Frage und antworten jeweils auf ihrer Seite.</label>
   <label style="display:block;margin:4px 0"><input type="radio" name="mode" value="alt"> <b>Abwechselnd:</b> Die Teams sind nacheinander dran.</label></fieldset>
  <button class="b" id="go" type="button" disabled>Rennen starten</button> <span class="sub" id="cnt"></span>
 </div>
</div>
<script>
const QS=new URLSearchParams(location.search),SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const GOAL=8,X0=130,X1=782,LANE=[{y:252,s:.86},{y:314,s:.96}],COL=["#c62f2f","#1f6fb8"],COAT=["#a8281f","#1c5c9a"];
const RIGHT=["Schwupps! Weiter geht’s!","Die Schubkarre rollt!","Wichtel-Power!","Meisterstück, die Karre fliegt!","Juhu, ein Stück näher am Ziel!","Auf dem Gipfel des Wissens!"];
const WRONG=["Hoppla! Die Karre kippelt.","Ein Stein im Weg!","Fast! Aber nicht ganz.","Autsch, die Karre wackelt!","Da bremst die Kuh."];

/* ---------- Szene ---------- */
function wichtel(i){
 const hat=COL[i],coat=COAT[i],glass=i===1;
 return `<g class="rig"><g class="bodybob">
  <ellipse cx="-56" cy="-3" rx="9" ry="5" fill="#3b2a1e"/><ellipse cx="-38" cy="-3" rx="9" ry="5" fill="#3b2a1e"/>
  <rect x="-60" y="-14" width="8" height="12" fill="#5b4636"/><rect x="-42" y="-14" width="8" height="12" fill="#5b4636"/>
  <path d="M-67,-16 Q-69,-48 -50,-54 Q-30,-48 -32,-16 Z" fill="${coat}"/>
  <rect x="-67" y="-30" width="35" height="5" fill="#2b2118"/><rect x="-53" y="-31" width="8" height="7" rx="1" fill="#f1c84b"/>
  <path d="M-36,-45 Q-24,-37 -14,-27" stroke="${coat}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-12" cy="-26" r="5" fill="#f2c9a5"/>
  <circle cx="-50" cy="-63" r="12" fill="#f2c9a5"/>
  <path d="M-62,-61 Q-62,-36 -50,-34 Q-38,-36 -38,-61 Q-50,-53 -62,-61Z" fill="#fff" stroke="#d9dde0" stroke-width=".6"/>
  <circle cx="-43" cy="-61" r="4.6" fill="#e8887a"/>
  <g class="ex ex-n"><circle cx="-53" cy="-67" r="1.9" fill="#1b1b1b"/><circle cx="-44" cy="-67" r="1.9" fill="#1b1b1b"/></g>
  <g class="ex ex-h"><path d="M-56,-66 Q-53,-70 -50,-66M-47,-66 Q-44,-70 -41,-66" stroke="#1b1b1b" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
  <g class="ex ex-s"><path d="M-56,-70 L-50,-64M-50,-70 L-56,-64M-47,-70 L-41,-64M-41,-70 L-47,-64" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/></g>
  ${glass?`<circle cx="-53" cy="-67" r="4.6" fill="none" stroke="#222" stroke-width="1.3"/><circle cx="-44" cy="-67" r="4.6" fill="none" stroke="#222" stroke-width="1.3"/><path d="M-48.4,-67 h-.2" stroke="#222"/>`:''}
  <path d="M-64,-69 Q-63,-90 -78,-105 Q-48,-102 -36,-69 Z" fill="${hat}"/><rect x="-65" y="-73" width="30" height="7" rx="3.5" fill="#fff"/><circle cx="-79" cy="-106" r="5.5" fill="#fff"/>
 </g>
 <g class="barrow">
  <line x1="-14" y1="-27" x2="22" y2="-22" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="6,-24 60,-35 54,-14 22,-11" fill="#b9814a" stroke="#6e4520" stroke-width="2"/>
  <line x1="22" y1="-11" x2="18" y2="0" stroke="#6e4520" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="17" y="-44" width="36" height="9" rx="1.5" fill="#c0392b"/><rect x="20" y="-52" width="31" height="8" rx="1.5" fill="#2f6fb3"/><rect x="24" y="-59" width="26" height="7" rx="1.5" fill="#3d9a5c"/>
  <line x1="37" y1="-59" x2="37" y2="-82" stroke="#6e4520" stroke-width="2"/><path d="M37,-82 L58,-76 L37,-70Z" fill="${hat}"/>
  <g class="wheel"><circle cx="46" cy="-14" r="14" fill="#2d2d2d"/><circle cx="46" cy="-14" r="9" fill="#d5dbe0"/><path d="M46,-23V-5M37,-14H55M39.6,-20.4L52.4,-7.6M52.4,-20.4L39.6,-7.6" stroke="#6b7780" stroke-width="1.5"/><circle cx="46" cy="-14" r="2.5" fill="#2d2d2d"/></g>
 </g>
 <g class="stars"><text x="-76" y="-116" font-size="15" fill="#f2b705">✦ ✧ ✦</text></g>
 <g class="bubble"><rect x="-30" y="-128" width="86" height="22" rx="11" fill="#fff" stroke="#222" stroke-width="1.5"/><text class="bt" x="13" y="-113" text-anchor="middle" font-size="12" font-weight="800" fill="#222"></text></g>
 </g>`;
}
function scene(){
 const s=[];
 s.push(`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky1"/><stop offset="1" class="sky2"/></linearGradient>
 <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb85a"/><stop offset="1" stop-color="#5a9640"/></linearGradient>
 <pattern id="chk" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff"/><rect width="6" height="6" fill="#222"/><rect x="6" y="6" width="6" height="6" fill="#222"/></pattern></defs>`);
 s.push(`<rect width="900" height="340" fill="url(#sg)"/>`);
 s.push(`<circle cx="95" cy="52" r="26" fill="#ffe27a" opacity=".95"/>`);
 s.push(`<g class="cloud" fill="#fff" opacity=".9"><ellipse cx="0" cy="45" rx="42" ry="14"/><ellipse cx="22" cy="36" rx="26" ry="14"/><ellipse cx="-22" cy="38" rx="22" ry="11"/></g><g class="cloud c2" fill="#fff" opacity=".8"><ellipse cx="0" cy="82" rx="34" ry="11"/><ellipse cx="16" cy="75" rx="20" ry="11"/></g>`);
 s.push(`<g class="dim">`);
 /* Alpenkette (Ammergauer/Wetterstein-Richtung) */
 s.push(`<path d="M0,170 L40,120 L70,138 L120,88 L160,128 L205,98 L250,138 L300,92 L350,132 L400,106 L450,140 L520,96 L570,134 L630,100 L690,138 L760,92 L820,128 L860,108 L900,134 L900,190 L0,190Z" fill="#9cb3cc"/>`);
 s.push(`<path d="M120,88 L106,106 L118,101 L128,109 L136,102 L148,112 L160,128 L150,110Z M300,92 L286,110 L298,105 L309,112 L321,104 L335,118 L350,132 L338,112Z M520,96 L506,114 L519,108 L530,116 L542,109 L556,121 L570,134 L558,114Z M760,92 L746,110 L759,105 L770,112 L782,104 L796,118 L820,128 L806,110Z" fill="#f4f8fc"/>`);
 /* Hügel */
 s.push(`<path d="M0,195 Q120,150 260,176 Q330,188 400,190 L400,200 L0,200Z" fill="#8cb673"/>`);
 /* Hohenpeißenberg mit Wallfahrtskirche */
 s.push(`<path d="M470,200 Q600,78 702,84 Q800,90 900,200Z" fill="#6aa04d"/><path d="M560,200 Q640,120 700,118 Q760,120 840,200Z" fill="#79ad5a" opacity=".6"/>`);
 s.push(`<g transform="translate(700,84)"><rect x="-22" y="-14" width="30" height="14" fill="#f7f1e4"/><path d="M-24,-14 L-7,-27 L10,-14Z" fill="#b5532e"/><rect x="8" y="-30" width="9" height="30" fill="#f7f1e4"/><path d="M6,-30 Q12.5,-44 19,-30 Q17,-34 12.5,-52 Q8,-34 6,-30Z" fill="#2f7a63"/><circle cx="12.5" cy="-54" r="1.6" fill="#e0b73c"/><rect x="-14" y="-9" width="4" height="9" fill="#7a4a2a"/></g>`);
 /* Weilheim: Häuser und Stadtpfarrkirche */
 s.push(`<g transform="translate(0,0)">${[[250,176,26,15,"#e9d9b8"],[280,174,22,17,"#d9b88c"],[304,177,28,14,"#efe3c9"],[392,176,24,14,"#e7cfa3"],[420,178,26,12,"#f1e8d4"],[446,176,22,14,"#d9b88c"]].map(h=>`<rect x="${h[0]}" y="${h[1]}" width="${h[2]}" height="${h[3]}" fill="${h[4]}"/><path d="M${h[0]-2},${h[1]} L${h[0]+h[2]/2},${h[1]-8} L${h[0]+h[2]+2},${h[1]}Z" fill="#a8452c"/>`).join("")}
 <rect x="344" y="150" width="14" height="40" fill="#efe6d2"/><rect x="334" y="170" width="32" height="20" fill="#efe6d2"/><path d="M341,150 Q351,128 361,150 Q356,142 351,118 Q346,142 341,150Z" fill="#2f7a63"/><circle cx="351" cy="116" r="1.6" fill="#e0b73c"/><path d="M332,170 L350,160 L368,170Z" fill="#a8452c"/></g>`);
 s.push(`</g>`);
 /* FOSBOS WM */
 s.push(`<g transform="translate(14,118)"><rect x="0" y="22" width="190" height="64" fill="#e6ebef" stroke="#b9c3cb"/><rect x="0" y="22" width="190" height="14" fill="#1d6fa8"/><rect x="12" y="8" width="166" height="20" rx="3" fill="#fff" stroke="#1d6fa8" stroke-width="2"/><text x="95" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#1d6fa8" font-family="system-ui,Arial,sans-serif" letter-spacing=".5">FOSBOS WM</text>
 ${[0,1,2,3,4,5,6,7].map(k=>`<rect x="${10+k*22}" y="44" width="14" height="16" fill="#9fd0ea" stroke="#7a8c99"/>`).join("")}<rect x="82" y="64" width="26" height="22" fill="#4a5a66"/></g>`);
 /* Wiese und Bahnen */
 s.push(`<rect y="190" width="900" height="150" fill="url(#gg)"/>`);
 s.push(`<path d="M0,196 Q150,186 300,196 T600,196 T900,196" stroke="#6d4a2a" stroke-width="3" fill="none" opacity=".7"/>`);
 for(let i=0;i<2;i++){const y=LANE[i].y;s.push(`<rect x="86" y="${y-34}" width="780" height="46" rx="10" fill="#c9a36b" opacity=".9"/><path d="M86,${y-11} H866" stroke="#fff" stroke-width="2" stroke-dasharray="14 10" opacity=".55"/>`)}
 s.push(`<rect x="118" y="212" width="6" height="116" fill="#fff" opacity=".8"/><text x="121" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="system-ui,Arial">START</text>`);
 /* Blumen, Tannen */
 s.push(`${[[40,206],[70,226],[22,290],[58,320],[890,244],[880,300],[100,332]].map(f=>`<circle cx="${f[0]}" cy="${f[1]}" r="3" fill="#fff"/><circle cx="${f[0]}" cy="${f[1]}" r="1.2" fill="#f2b705"/>`).join("")}
 <g transform="translate(884,200)"><path d="M0,0 L-14,26 L14,26Z M0,14 L-18,42 L18,42Z" fill="#2f6a3d"/><rect x="-3" y="42" width="6" height="8" fill="#5a3a1e"/></g>`);
 /* Kuh (Zuschauerin) */
 s.push(`<g transform="translate(40,252)"><ellipse cx="0" cy="0" rx="22" ry="12" fill="#fff" stroke="#999"/><ellipse cx="-6" cy="-3" rx="7" ry="5" fill="#2c2c2c"/><ellipse cx="9" cy="3" rx="6" ry="4" fill="#2c2c2c"/><circle cx="22" cy="-6" r="8" fill="#fff" stroke="#999"/><ellipse cx="27" cy="-4" rx="5" ry="3.5" fill="#f0b4b4"/><circle cx="21" cy="-9" r="1.3" fill="#222"/><path d="M17,-13 l-3,-5 M24,-13 l3,-5" stroke="#999" stroke-width="2"/><rect x="-14" y="8" width="4" height="12" fill="#ddd"/><rect x="10" y="8" width="4" height="12" fill="#ddd"/><text x="0" y="-22" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="system-ui,Arial">Muh!</text></g>`);
 /* Ziel */
 s.push(`<g><rect x="842" y="190" width="8" height="150" fill="#6e4520"/><rect x="842" y="196" width="48" height="16" fill="url(#chk)" stroke="#222"/><text x="866" y="226" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" stroke="#222" stroke-width=".6" font-family="system-ui,Arial">ZIEL</text></g>`);
 for(let i=0;i<2;i++)s.push(`<g class="wich" id="w${i}" style="transform:translate(${X0}px,${LANE[i].y}px) scale(${LANE[i].s})">${wichtel(i)}</g>`);
 $("scene").innerHTML=s.join("");
}
function setX(i,steps){$("w"+i).style.transform=`translate(${X0+(X1-X0)*Math.min(steps,GOAL)/GOAL}px,${LANE[i].y}px) scale(${LANE[i].s})`}
function say(i,txt,cls,ms){const w=$("w"+i);w.querySelector(".bt").textContent=txt;w.classList.add("show");if(cls)w.classList.add(cls);setTimeout(()=>{w.classList.remove("show");if(cls)w.classList.remove(cls)},ms||1600)}
function move(i,steps){const w=$("w"+i);w.classList.add("moving","happy");setX(i,steps);setTimeout(()=>w.classList.remove("moving","happy"),1300)}

/* ---------- Spiel ---------- */
let DATA=null,Q=[],c=[0,0],turn=0,names=["Team Rot","Team Blau"],answered=false,cur=null;
const SEED=+QS.get("spiel")||0;
function load(){fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{DATA=d;$("t").textContent=d.titel;$("a").textContent=d.anleitung;$("cnt").textContent=d.fragen.length+" Fragen im Pool";$("go").disabled=d.fragen.length<20}).catch(()=>{$("a").innerHTML='<span class="err">Die Übung konnte nicht geladen werden.</span>'})}
function chips(){
 $("board").hidden=false;
 $("board").innerHTML=[0,1].map(i=>`<div class="chip${mode==="alt"&&turn%2===i&&!over?" turn":""}"><span class="dot" style="background:${COL[i]}"></span><b>${esc(names[i])}</b><span class="st">${Math.min(c[i],GOAL)} / ${GOAL}</span></div>`).join("");
}
let over=false,mode="sim",ans=[null,null],t0=0,roundDone=false;
function begin(){
 mode=document.querySelector("input[name=mode]:checked").value;
 names=[$("n0").value.trim()||"Team Rot",$("n1").value.trim()||"Team Blau"];
 const r=rng((SEED||Math.floor(Math.random()*999)+1)*31+7);
 const seen=new Set();Q=sh(DATA.fragen,r).filter(q=>!seen.has(q.f)&&seen.add(q.f)).slice(0,40).map(q=>{const idx=q.o.map((t,k)=>({t,ok:k===q.r}));return {c:q.c,f:q.f,o:sh(idx,r)}});
 c=[0,0];turn=0;over=false;setX(0,0);setX(1,0);mode==="sim"?askSim():ask();
}
function ask(){
 cur=Q[turn];answered=false;const i=turn%2;chips();
 $("stage").innerHTML=`<div class="card"><div class="turnbar"><span class="dot" style="background:${COL[i]}"></span>${esc(names[i])} ist dran – ${i===0?"die linke Schubkarre":"die rechte Schubkarre"}</div>${cur.c?`<div class="ctx">${esc(cur.c)}</div>`:""}<p class="qt">${esc(cur.f)}</p><div class="opts">${cur.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div><div id="fb"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
}
function answer(k){
 if(answered)return;answered=true;const i=turn%2,ok=cur.o[k].ok;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(cur.o[j].ok)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 if(ok){c[i]++;move(i,c[i]);say(i,"Juhu!","happy",1700)}else{const w=$("w"+i);w.classList.add("oops");say(i,"Hoppla!","",1700);setTimeout(()=>w.classList.remove("oops"),1500)}
 const right=cur.o.find(o=>o.ok).t;
 const last=turn%2===1;
 $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?pick(RIGHT):pick(WRONG)}${ok?"":`<small>Richtig wäre gewesen: ${esc(right)}</small>`}</div><p style="margin:12px 0 0"><button class="b" id="nx" type="button">Weiter</button></p>`;
 chips();$("nx").focus();$("nx").addEventListener("click",next);
}
function next(){
 if(mode==="sim"){nextSim();return}
 if(turn%2===1||turn+1>=Q.length){
  const a=c[0],b=c[1],done=Math.max(a,b)>=GOAL;
  if((done&&a!==b)||turn+1>=Q.length){finish();return}
 }
 turn++;ask();
}
function finish(){
 over=true;chips();const a=c[0],b=c[1],w=a>b?0:b>a?1:-1;
 if(w>=0){$("w"+w).classList.add("win");setX(w,GOAL)}
 $("stage").innerHTML=`<div class="card"><p class="end">${w<0?"Unentschieden – Zielfoto!":esc(names[w])+" gewinnt das Rennen!"}</p><p style="margin:0 0 12px">${esc(names[0])}: ${a} richtig · ${esc(names[1])}: ${b} richtig · ${turn+1} Fragen gespielt.</p><button class="b" id="again" type="button">Noch ein Rennen</button></div>`;
 $("again").addEventListener("click",()=>{document.querySelectorAll(".win").forEach(e=>e.classList.remove("win"));begin()});
}
/* ---------- Gleichzeitig: dieselbe Frage für beide Teams ---------- */
function askSim(){
 cur=Q[turn];ans=[null,null];roundDone=false;t0=Date.now();chips();
 const col=i=>`<div class="simcol" data-team="${i}"><div class="simh" style="border-color:${COL[i]}"><span class="dot" style="background:${COL[i]}"></span><b>${esc(names[i])}</b><span class="simst" id="ss${i}">Wählt ...</span></div>${cur.o.map((o,k)=>`<button class="opt" type="button" data-team="${i}" data-k="${k}"><span class="k">${i===0?k+1:[7,8,9,0][k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
 $("stage").innerHTML=`<div class="card"><div class="turnbar">Frage ${turn+1} · beide Teams antworten gleichzeitig</div>${cur.c?`<div class="ctx">${esc(cur.c)}</div>`:""}<p class="qt">${esc(cur.f)}</p><div class="simgrid">${col(0)}${col(1)}</div><div id="fb"></div><p style="margin:12px 0 0"><button class="b alt" id="force" type="button" hidden>Auflösen</button></p></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answerSim(+b.dataset.team,+b.dataset.k)));
 $("force").addEventListener("click",()=>resolveSim());
}
function answerSim(i,k){
 if(roundDone||ans[i]!==null||!cur||k>=cur.o.length)return;
 ans[i]={k,t:Date.now()-t0};
 document.querySelectorAll(`.opt[data-team="${i}"]`).forEach((b,j)=>{b.disabled=true;if(j===k)b.classList.add("pick")});
 $("ss"+i).textContent="Antwort abgegeben ✓";
 if(ans[0]&&ans[1])resolveSim();else $("force").hidden=false;
}
function resolveSim(){
 if(roundDone)return;roundDone=true;$("force").hidden=true;
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 const okIdx=cur.o.findIndex(o=>o.ok),res=[0,1].map(i=>ans[i]&&ans[i].k===okIdx);
 document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.team,j=+b.dataset.k;b.disabled=true;b.classList.remove("pick");
  if(j===okIdx)b.classList.add("ok");else if(ans[i]&&ans[i].k===j)b.classList.add("bad")});
 [0,1].forEach(i=>{$("ss"+i).textContent=!ans[i]?"keine Antwort":res[i]?"richtig"+(ans[i].t?" · "+(ans[i].t/1000).toFixed(1).replace(".",",")+" s":""):"falsch";
  if(res[i]){c[i]++;move(i,c[i]);say(i,"Juhu!","happy",1700)}else{const w=$("w"+i);w.classList.add("oops");say(i,"Hoppla!","",1700);setTimeout(()=>w.classList.remove("oops"),1500)}});
 const txt=res[0]&&res[1]?"Beide richtig, die Schubkarren rollen!":res[0]||res[1]?esc(names[res[0]?0:1])+" ist vorn dran: "+pick(RIGHT):"Keiner richtig. "+pick(WRONG);
 $("fb").innerHTML=`<div class="fb ${res[0]||res[1]?"ok":"bad"}">${txt}<small>Richtig: ${esc(cur.o[okIdx].t)}</small></div><p style="margin:12px 0 0"><button class="b" id="nx" type="button">Weiter</button></p>`;
 chips();$("nx").focus();$("nx").addEventListener("click",next);
 window.__res=res;
}
function nextSim(){
 const a=c[0],b=c[1],res=window.__res||[0,0];
 if(Math.max(a,b)>=GOAL){
  if(a!==b){finish();return}
  if(res[0]&&res[1]){ /* Gleichstand im Ziel: schnellere richtige Antwort entscheidet */
   const f=ans[0].t<=ans[1].t?0:1;c[f]++;finish();return}
 }
 if(turn+1>=Q.length){finish();return}
 turn++;askSim();
}

document.addEventListener("keydown",e=>{
 if(!cur||over)return;const n=parseInt(e.key,10);
 if(mode==="sim"){
  if(e.key==="Enter"&&roundDone&&$("nx")){$("nx").click();e.preventDefault();return}
  const m={"1":[0,0],"2":[0,1],"3":[0,2],"4":[0,3],"7":[1,0],"8":[1,1],"9":[1,2],"0":[1,3]}[e.key];
  if(m){answerSim(m[0],m[1]);e.preventDefault()}return}
 if(!answered&&n>=1&&n<=cur.o.length){answer(n-1);e.preventDefault()}
 else if(answered&&(e.key==="Enter")&&$("nx")){$("nx").click();e.preventDefault()}
});
window.Rennen={cur:()=>cur,c:()=>c};
scene();load();$("go").addEventListener("click",begin);
</script></main></body></html>
